<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="60%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="10" fill="#060B18"/>
  <rect width="48" height="48" rx="10" fill="none" stroke="url(#g2)" stroke-width="0.8" opacity="0.35"/>

  <!-- Neural "B" mark -->
  <!-- Vertical spine -->
  <line x1="13" y1="9" x2="13" y2="39" stroke="#00D4FF" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Top bump of B -->
  <path d="M13 9 Q28 9 28 16.5 Q28 24 13 24" fill="none" stroke="url(#g2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Bottom bump of B (wider) -->
  <path d="M13 24 Q31 24 31 31.5 Q31 39 13 39" fill="none" stroke="url(#g1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Neural node dots -->
  <circle cx="13" cy="9"    r="3"   fill="#00D4FF" filter="url(#glow)"/>
  <circle cx="13" cy="24"   r="2.2" fill="#00D4FF" opacity="0.9" filter="url(#glow)"/>
  <circle cx="13" cy="39"   r="3"   fill="#FF9900" filter="url(#glow)"/>
  <circle cx="27.5" cy="16.5" r="2" fill="#00D4FF" opacity="0.7"/>
  <circle cx="30.5" cy="31.5" r="2" fill="#FF9900" opacity="0.8"/>

  <!-- Small accent dots for neural feel -->
  <circle cx="38" cy="10" r="1.5" fill="#00D4FF" opacity="0.4"/>
  <circle cx="40" cy="24" r="1"   fill="#FF9900" opacity="0.3"/>
  <circle cx="38" cy="38" r="1.5" fill="#FF9900" opacity="0.4"/>
</svg>
